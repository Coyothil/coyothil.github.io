<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./CSS-LOGIN/style-create.css">
  <title>Crear cuenta | Astra Index</title>
</head>
<body>
  <div class="split-container">
    <div class="split-left">
      <img class="background-img" src="./Assets/imagenes/image-210.png" alt="Fondo astronómico decorativo" />
    </div>
    <main class="split-right">
      <div class="create-account">
        <div class="brand-header">
          <img class="logo" src="./Assets/imagenes/frame-10.png" alt="Logo Astra Index" />
          <h1 class="astra-index">Astra Index</h1>
        </div>
        <div class="account-switch">
          <span>Already have an account?</span>
          <a class="login-link" href="Login.html">Login</a>
        </div>
        <section class="form-section">
          <h2 class="form-title">Create account</h2>
          <button class="google-btn" type="button">
            <img class="google-icon" src="./Assets/imagenes/image-20.png" alt="Google" />
            Continue with Google
          </button>
          <div class="divider">
            <span>or Sign up with Email</span>
          </div>
          <form class="register-form" autocomplete="on">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="mail@abc.com" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="*************" required>
            <div class="form-options">
              <label class="remember-label">
                <input type="checkbox" name="remember" /> Remember Me
              </label>
              <a class="forgot-password" href="Password.html">Forgot Password?</a>
            </div>
            <button class="submit-btn" type="submit">Get Started</button>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script>
    document.querySelector('.register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
